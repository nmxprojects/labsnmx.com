# Sends one browser-notification campaign to your subscribers. Free: standard Web Push, signed with your own VAPID key.
#
# Started three ways:
#  1. Automatically by the Apps Script backend (Code-Blog.gs v4): a new blog post at 9 AM IST, a new YouTube video,
#     or "Send" on labsnmx.com/tools/alerts/. It passes campaign_id.
#  2. By hand: Actions tab > "Send push notification" > Run workflow > fill in Title, Message and Link.
#  3. Again for a failed campaign: Run workflow with its campaign_id (from the "Push campaigns" tab).
#
# One-time setup: Settings > Secrets and variables > Actions > New repository secret, five times:
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY   from labsnmx.com/tools/push-keys/ (never change them once people subscribe)
#   VAPID_SUBJECT                         mailto:nmxprojects@gmail.com
#   PUSH_API_URL                          your Apps Script /exec URL (the same one as BACKEND_URL in assets/nmx.js)
#   PUSH_API_KEY                          PUSH_API_KEY from the Apps Script log (run checkPushSetup())
name: Send push notification

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: 'Campaign ID (filled in by the backend). Leave empty to send the message below.'
        required: false
        default: ''
      title:
        description: 'Title, for a manual send (up to 90 characters)'
        required: false
        default: ''
      message:
        description: 'Message (optional, up to 200 characters)'
        required: false
        default: ''
      url:
        description: 'Link that opens when tapped'
        required: false
        default: 'https://labsnmx.com/blog/'
      audience:
        description: 'Who gets it'
        type: choice
        options: [all, blog, youtube]
        default: all

permissions:
  contents: read

concurrency:
  group: send-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-push
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7

      - name: Send
        run: node scripts/send-push.mjs
        env:
          PUSH_API_URL: ${{ secrets.PUSH_API_URL }}
          PUSH_API_KEY: ${{ secrets.PUSH_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
          LINK: ${{ inputs.url }}
          AUDIENCE: ${{ inputs.audience }}
