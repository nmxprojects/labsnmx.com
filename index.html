<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NMX Labs — Designed to Perform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f3;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 80px;
        }

        .eyebrow {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            opacity: 0.5;
        }

        h1 {
            font-size: clamp(60px, 10vw, 140px);
            line-height: 0.9;
            letter-spacing: -7px;
            font-weight: 700;
        }

        .description {
            margin: 35px auto 0;
            max-width: 500px;
            font-size: 18px;
            line-height: 1.5;
            color: #555;
        }

        .footer {
            margin-top: 100px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">nmx labs</div>

        <div class="eyebrow">Creative & Marketing Studio</div>

        <h1>
            Designed<br>
            to perform.
        </h1>

        <p class="description">
            We're building something for brands that want to
            look better, communicate better and perform better.
        </p>

        <div class="footer">
            Coming soon · nmxprojects@gmail.com
        </div>

    </main>

</body>
</html>
