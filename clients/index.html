:root{
  /* tokens lifted directly from labsnmx.com */
  --bg:#faf9f6;
  --ink:#111110;
  --navy:#000F52;
  --muted:#8c8a84;
  --line:rgba(17,17,16,.10);
  --line-soft:rgba(17,17,16,.055);
  --orange:#ff5a2b;
  --accent:#ff5a2b;

  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-display:'Liliana','Inter',system-ui,-apple-system,sans-serif;

  --gut:clamp(18px,4.4vw,64px);
  --ease:cubic-bezier(.16,1,.3,1);
}

*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:clamp(15px,1.05vw,17px);line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img,video,canvas{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0}
::selection{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-size:clamp(10px,.74vw,12px);letter-spacing:.16em;text-transform:uppercase;font-weight:500}

body.no-cursor{cursor:none}
body.no-cursor a,body.no-cursor button{cursor:none}

/* ---------- loader ---------- */
#loader{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .8s var(--ease),visibility .8s;
}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
#loader img{height:26px;width:auto}
.load-bar{width:min(200px,44vw);height:1px;background:var(--line);overflow:hidden}
.load-bar i{display:block;height:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s linear}
.load-pct{color:var(--muted)}

/* ---------- cursor ---------- */
.cur{
  position:fixed;top:0;left:0;z-index:160;pointer-events:none;
  width:36px;height:36px;border:1px solid rgba(17,17,16,.4);border-radius:50%;
  display:grid;place-items:center;transform:translate3d(-50%,-50%,0);will-change:transform;
  transition:width .35s var(--ease),height .35s var(--ease),background .35s var(--ease),border-color .35s var(--ease);
}
.cur b{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;opacity:0;transition:opacity .25s}
.cur.wide{width:84px;height:84px;background:var(--ink);border-color:var(--ink)}
.cur.wide b{opacity:1;color:var(--bg)}
.cur-dot{position:fixed;top:0;left:0;z-index:161;width:4px;height:4px;border-radius:50%;background:var(--ink);pointer-events:none;transform:translate3d(-50%,-50%,0);will-change:transform}
.touch .cur,.touch .cur-dot{display:none}

/* ---------- nav ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:120;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px var(--gut);
  transition:opacity .5s var(--ease);
}
.nav img{height:20px;width:auto}
.nav-links{display:flex;gap:clamp(16px,2.6vw,36px);align-items:center}
.nav-links a{position:relative;color:var(--ink)}
.nav-links a::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:1px;background:var(--orange);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.nav-links a:hover::after,.nav-links a[aria-current]::after{transform:scaleX(1);transform-origin:left}
.nav-cta{background:var(--orange);color:#fff;padding:9px 16px;border-radius:100px;letter-spacing:.08em}
.nav-cta::after{display:none!important}
.nav-cta:hover{background:var(--ink)}
@media(max-width:860px){.nav-links a:not(.nav-cta){display:none}}

/* ============================================================
   THE FLIGHT — one fixed 3D world, the whole viewport, edge to edge
   ============================================================ */
#flight{position:relative;z-index:1}
.world{
  position:fixed;inset:0;z-index:2;
  perspective:1000px;perspective-origin:50% 50%;
  overflow:hidden;pointer-events:none;
  background:var(--bg);
}
.world::after{ /* depth haze — far cards sink into the paper */
  content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(250,249,246,.72) 100%);
}
.cam{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}

.card{
  position:absolute;
  transform-style:preserve-3d;
  border-radius:12px;overflow:hidden;
  background:#fff;
  box-shadow:0 30px 60px -28px rgba(17,17,16,.32), 0 2px 8px rgba(17,17,16,.05);
  will-change:transform,opacity,filter;
  backface-visibility:hidden;
  pointer-events:auto;
}
.card img,.card canvas,.card video{width:100%;height:100%;object-fit:cover}
.card figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:9px 12px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:#fff;background:linear-gradient(transparent,rgba(17,17,16,.62));
  opacity:0;transition:opacity .4s var(--ease);
}
.card:hover figcaption{opacity:1}

/* ---------- fixed chapter headline (bottom-left, over the field) ---------- */
.hud{
  position:fixed;inset:0;z-index:4;pointer-events:none;
  padding:0 var(--gut) clamp(26px,5vh,54px);
  display:flex;flex-direction:column;justify-content:flex-end;
}
.chapter{
  position:absolute;left:var(--gut);right:var(--gut);bottom:clamp(26px,5vh,54px);
  opacity:0;transform:translateY(18px);
  transition:opacity .55s var(--ease),transform .55s var(--ease);
  max-width:min(940px,84vw);
}
.chapter.on{opacity:1;transform:none}
.ch-eyebrow{display:flex;align-items:center;gap:12px;color:var(--muted);margin-bottom:14px}
.ch-eyebrow s{width:30px;height:1px;background:var(--orange);text-decoration:none;display:block}
.ch-hook{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(38px,7.4vw,132px);line-height:.9;letter-spacing:-.035em;
  color:var(--ink);
}
.ch-hook em{font-style:normal;color:var(--orange)}
.ch-sub{margin-top:16px;max-width:44ch;color:var(--muted);pointer-events:auto}
.ch-facts{display:flex;gap:clamp(14px,2.6vw,38px);flex-wrap:wrap;margin-top:18px;color:var(--muted)}
.ch-facts b{display:block;color:var(--ink);font-weight:600;margin-top:3px;font-size:13px;letter-spacing:0;text-transform:none}
/* ---------- tablet ---------- */
@media(max-width:1023px){
  .ch-hook{font-size:clamp(40px,8.2vw,84px)}
  .ch-sub{max-width:38ch}
}
/* ---------- mobile ---------- */
@media(max-width:767px){
  .hud{padding:0 var(--gut) calc(58px + env(safe-area-inset-bottom,0px))}
  .hud::before{
    content:'';position:absolute;left:0;right:0;bottom:0;height:64%;
    background:linear-gradient(transparent 0%, rgba(250,249,246,.86) 40%, var(--bg) 82%);
    pointer-events:none;
  }
  .chapter{z-index:1}
  .chapter{bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:100%}
  .ch-hook{font-size:clamp(36px,10.6vw,60px);line-height:.94;letter-spacing:-.03em}
  .ch-eyebrow{margin-bottom:10px;font-size:10px}
  .ch-sub{
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;margin-top:12px;font-size:14px;line-height:1.5;max-width:100%;
  }
  .ch-facts{gap:16px;margin-top:14px}
  .ch-facts div:nth-child(n+3){display:none}   /* two facts is plenty on a phone */
  .ch-facts b{font-size:12px}
  .card{border-radius:10px;box-shadow:0 18px 36px -20px rgba(17,17,16,.34)}
  .card figcaption{opacity:1;font-size:9px;padding:7px 9px}
  .cue{bottom:calc(34px + env(safe-area-inset-bottom,0px));font-size:10px}
  .world::after{background:radial-gradient(ellipse at 50% 46%, transparent 34%, rgba(250,249,246,.8) 100%)}
}

/* ---------- chapter dots: the rail's stand-in on small screens ---------- */
.dots{
  position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:6;display:none;justify-content:center;gap:7px;pointer-events:none;
  transition:opacity .5s var(--ease);
}
.dots i{
  display:block;width:6px;height:6px;border-radius:50%;
  background:var(--muted);opacity:.4;
  transition:width .45s var(--ease),background .45s var(--ease),opacity .45s var(--ease);
}
.dots i.on{width:22px;border-radius:3px;background:var(--orange);opacity:1}
@media(max-width:900px){.dots{display:flex}}

/* ---------- flight instruments (right edge) ---------- */
.rail{
  position:fixed;right:var(--gut);top:50%;transform:translateY(-50%);
  z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:12px;
  pointer-events:none;transition:opacity .5s var(--ease);
}
.rail-z{font-size:10px;letter-spacing:.14em;color:var(--muted);text-align:right;line-height:1.6}
.rail-z b{display:block;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.rail-ticks{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.rail-ticks i{display:block;width:12px;height:1px;background:var(--muted);opacity:.5;transition:width .45s var(--ease),background .45s var(--ease),opacity .45s var(--ease)}
.rail-ticks i.on{width:30px;background:var(--orange);opacity:1}
@media(max-width:900px){.rail{display:none}}

.cue{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;
  color:var(--muted);display:flex;align-items:center;gap:9px;pointer-events:none;
  transition:opacity .5s var(--ease);
}
.cue i{display:block;width:1px;height:26px;background:linear-gradient(var(--muted),transparent);position:relative;overflow:hidden}
.cue i::after{content:'';position:absolute;inset:0;background:var(--ink);animation:cue 2.2s var(--ease) infinite}
@keyframes cue{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}
.hide{opacity:0!important}

/* ---------- grounded sections after the flight ---------- */
.after{position:relative;z-index:6;background:var(--bg)}
#index{padding:clamp(80px,13vh,160px) var(--gut) clamp(50px,8vh,110px)}
.index-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px;color:var(--muted)}
.index-list{list-style:none}
.idx{
  display:grid;grid-template-columns:auto 1fr auto;gap:clamp(12px,3vw,40px);align-items:center;
  padding:clamp(16px,2.4vw,28px) 0;border-bottom:1px solid var(--line-soft);
  transition:padding-left .5s var(--ease);
}
.idx:hover{padding-left:14px}
.idx .n{color:var(--muted);font-size:11px;letter-spacing:.14em;font-weight:600}
.idx .t{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,4.2vw,56px);letter-spacing:-.03em;line-height:1;transition:color .4s var(--ease),opacity .4s var(--ease)}
.idx .c{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:right}
.index-list:hover .idx .t{opacity:.3}
.index-list .idx:hover .t{opacity:1;color:var(--orange)}
@media(max-width:900px){.idx{grid-template-columns:auto 1fr}.idx .c{grid-column:2;text-align:left;margin-top:6px}}

#cta{padding:clamp(90px,17vh,210px) var(--gut);text-align:center}
.cta-line{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,6.4vw,104px);line-height:.94;letter-spacing:-.035em}
.cta-line em{font-style:normal;color:var(--muted)}
.cta-btn{
  display:inline-flex;align-items:center;gap:12px;margin-top:clamp(26px,4.6vh,48px);
  padding:15px 28px;border:1px solid var(--ink);border-radius:100px;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  will-change:transform;transition:background .45s var(--ease),color .45s var(--ease);
}
.cta-btn:hover{background:var(--ink);color:var(--bg)}
.cta-btn svg{width:15px;height:15px;transition:transform .45s var(--ease)}
.cta-btn:hover svg{transform:translateX(5px)}

footer{border-top:1px solid var(--line);padding:40px var(--gut) 36px;display:grid;grid-template-columns:1fr auto;gap:28px;color:var(--muted)}
footer img{height:18px;width:auto;margin-bottom:10px}
.foot-links{display:flex;gap:clamp(12px,2.2vw,28px);flex-wrap:wrap}
.foot-links a{color:var(--ink);transition:color .35s var(--ease)}
.foot-links a:hover{color:var(--orange)}
@media(max-width:700px){footer{grid-template-columns:1fr}}

/* ---------- fallback: reduced motion / no JS ---------- */
.flat .world{position:relative;height:auto;overflow:visible;perspective:none;background:none}
.flat .world::after{display:none}
.flat .cam{position:relative;transform:none!important;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:0 var(--gut)}
.flat .card{position:relative!important;transform:none!important;opacity:1!important;filter:none!important;
  width:auto!important;height:auto!important;aspect-ratio:1;left:auto!important;top:auto!important}
.flat .card figcaption{opacity:1}
.flat .hud{position:relative;inset:auto;padding:clamp(50px,8vh,90px) var(--gut) 20px;display:block;height:auto}
.flat .chapter{position:relative;left:auto;right:auto;bottom:auto;opacity:1;transform:none;margin-bottom:20px;max-width:none}
.flat .rail,.flat .cue{display:none}
.flat #flight{height:auto!important}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

  } else {
    vid.load();
    const vtick=()=>{
      if(!scrubbing)return;
      if(vidReady&&isFinite(vid.duration)){
        const now=vid.currentTime;
        const next=lerp(now,vidTarget*vid.duration,.16);
        if(Math.abs(next-now)>.012) vid.currentTime=next;
      }
      requestAnimationFrame(vtick);
    };
    window.__startScrub=()=>{ if(!scrubbing){scrubbing=true;requestAnimationFrame(vtick);} };
    window.__stopScrub =()=>{ scrubbing=false; };
  }
}

/* ===========================================================
   THE CAMERA — damped travel, pointer tilt, per-card depth
   =========================================================== */
let travel=0, target=0, px=0, py=0, tpx=0, tpy=0, running=false, activeCh=-1;
const railZ=document.getElementById('railZ');
const railName=document.getElementById('railName');
const cue=document.getElementById('cue');
const rail=document.getElementById('rail');

function readScroll(){
  const flight=document.getElementById('flight');
  const total=flight.offsetHeight-innerHeight;
  const p=clamp(scrollY/Math.max(total,1),0,1);
  target=p*(CHAPTERS.length-1)*SPAN;
  // hide the world once the flight is over
  const past = scrollY > flight.offsetHeight - innerHeight*0.6;
  world.style.opacity = past?0:1;
  world.style.visibility = past?'hidden':'visible';
  hud.style.opacity = past?0:1;
  rail.classList.toggle('hide',past);
  dotsWrap.classList.toggle('hide',past);
  kick();
}

function kick(){ if(!running){running=true;requestAnimationFrame(frame);} }

function frame(){
  const prev=travel;
  travel=lerp(travel,target,.085);
  px=lerp(px,tpx,.06); py=lerp(py,tpy,.06);
  cam.style.transform=`rotateY(${px}deg) rotateX(${py}deg)`;

  const V=vmin();
  for(let i=0;i<cards.length;i++){
    const c=cards[i], s=c.slot;
    if(!s) continue;
    const z = s.z + travel - c.ci*SPAN;

    if(z<-2500||z>620){ if(c.el.style.display!=='none')c.el.style.display='none'; continue; }
    if(c.el.style.display==='none')c.el.style.display='';

    // slot % -> px, minus half the card so it sits on its anchor
    const x = s.x/100*innerWidth  - c.w*V/2;
    const y = s.y/100*innerHeight - c.h*V/2;
    const drift = travel*0.0016;                       // cards rotate as you pass
    const o = Math.min(map(z,-2500,-1500,0,1), map(z,620,260,0,1));
    const bl = map(z,-1400,-500,7,0);

    c.el.style.transform =
      `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${z.toFixed(1)}px)`+
      `rotateX(${(s.rx+drift).toFixed(2)}deg)rotateY(${(s.ry-drift).toFixed(2)}deg)rotateZ(${s.rz}deg)`;
    c.el.style.opacity=o.toFixed(3);
    // blur is expensive on phones — opacity alone carries the depth there
    if(MODE.blur) c.el.style.filter= bl>.15?`blur(${bl.toFixed(1)}px)`:'none';
    else if(c.el.style.filter) c.el.style.filter='none';
  }

  // which chapter is the camera sitting in?
  const idx=clamp(Math.round(travel/SPAN),0,CHAPTERS.length-1);
  if(idx!==activeCh){
    activeCh=idx;
    chapterEls.forEach((el,k)=>el.classList.toggle('on',k===idx));
    ticks.forEach((t,k)=>t.classList.toggle('on',k===idx));
    dots.forEach((d,k)=>d.classList.toggle('on',k===idx));
    railName.textContent=CHAPTERS[idx].brand;
    if(CHAPTERS[idx].motion){ loadAllFrames(); window.__startScrub&&window.__startScrub(); }
    else window.__stopScrub&&window.__stopScrub();
  }
  railZ.textContent='Z '+String(Math.round(travel)).padStart(4,'0');
  cue.classList.toggle('hide',travel>140);

  // motion chapter: local progress drives both sequence and film
  const mi=CHAPTERS.findIndex(c=>c.motion);
  if(mi>-1){
    const local=clamp((travel-(mi-0.5)*SPAN)/SPAN,0,1);
    seqAt(local); vidTarget=local;
  }

  if(Math.abs(travel-target)>.4||Math.abs(px-tpx)>.01||Math.abs(py-tpy)>.01){
    requestAnimationFrame(frame);
  } else { running=false; }              // idle = zero cost
}

addEventListener('scroll',readScroll,{passive:true});
let rzT=null;
addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{ applyMode(); readScroll(); kick(); },140);
  kick();
},{passive:true});
addEventListener('orientationchange',()=>{
  setTimeout(()=>{ applyMode(); readScroll(); kick(); },220);
},{passive:true});
if(!touch){
  addEventListener('pointermove',e=>{
    tpx=((e.clientX/innerWidth)-.5)*MODE.tilt;
    tpy=((e.clientY/innerHeight)-.5)*-(MODE.tilt*.66);
    kick();
  },{passive:true});
}

/* ===========================================================
   CURSOR
   =========================================================== */
if(!touch){
  const cur=document.querySelector('.cur'), dot=document.querySelector('.cur-dot');
  const lab=cur.querySelector('b');
  let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,craf=null;
  const cloop=()=>{
    cx=lerp(cx,mx,.18);cy=lerp(cy,my,.18);
    dot.style.transform=`translate3d(${mx}px,${my}px,0) translate(-50%,-50%)`;
    cur.style.transform=`translate3d(${cx}px,${cy}px,0) translate(-50%,-50%)`;
    if(Math.abs(cx-mx)>.3||Math.abs(cy-my)>.3)craf=requestAnimationFrame(cloop);
    else craf=null;
  };
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(!craf)craf=requestAnimationFrame(cloop);},{passive:true});
  const set=(on,t)=>{cur.classList.toggle('wide',on);lab.textContent=on?t:'';};
  document.addEventListener('pointerover',e=>{
    const c=e.target.closest('.card');
    if(c){ set(true, c.dataset.kind==='film'?'Play':c.dataset.kind==='seq'?'Scrub':'View'); return; }
    if(e.target.closest('a,button')){ set(true,'Open'); return; }
    set(false);
  });
}

/* ===========================================================
   MAGNETIC CTA
   =========================================================== */
if(!touch&&!reduced){
  const b=document.getElementById('ctaBtn');
  b.addEventListener('pointermove',e=>{
    const r=b.getBoundingClientRect();
    b.style.transform=`translate(${(e.clientX-(r.left+r.width/2))*.28}px,${(e.clientY-(r.top+r.height/2))*.34}px)`;
  });
  b.addEventListener('pointerleave',()=>{b.style.transform='';});
}

/* ===========================================================
   LOADER + BOOT
   =========================================================== */
const crit=[A('logo'),A(CHAPTERS[0].images[0]),A(CHAPTERS[0].images[1])].filter(Boolean);
let done=0;
const fill=document.getElementById('loadFill'),pctEl=document.getElementById('loadPct');
function tickLoad(){
  const v=crit.length?done/crit.length:1;
  fill.style.transform=`scaleX(${v})`; pctEl.textContent=Math.round(v*100);
}
let entered=false;
function enter(){
  if(entered)return; entered=true;
  fill.style.transform='scaleX(1)'; pctEl.textContent='100';
  setTimeout(()=>{
    document.getElementById('loader').classList.add('done');
    chapterEls[0].classList.add('on'); ticks[0].classList.add('on');
    activeCh=0; railName.textContent=CHAPTERS[0].brand;
    dots[0].classList.add('on');
    applyMode(); readScroll(); kick();
  },240);
}
crit.forEach(src=>{const im=new Image();im.onload=im.onerror=()=>{done++;tickLoad();if(done>=crit.length)enter();};im.src=src;});
if(!crit.length)enter();
setTimeout(enter,3500);

/* reduced motion → a plain, readable grid of the same work */
if(reduced){
  document.body.classList.add('flat');
  document.getElementById('flight').style.height='auto';
  cards.forEach(c=>{c.el.style.width='';c.el.style.height='';});
  loadAllFrames(); seqAt(.4);
  chapterEls.forEach(el=>el.classList.add('on'));
}
})();
</script>
