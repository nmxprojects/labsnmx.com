<section class="comments" id="comments" aria-labelledby="commentsH" data-comments data-slug="{slug}">
  <h2 id="commentsH">Comments</h2>
  <p class="c-intro">Questions, corrections or your own experience with this? Add it below. We read every comment and publish it after a quick check for spam.</p>
  <ol class="c-list" data-c-list><li class="c-empty">Loading comments…</li></ol>
  <form class="c-form" data-c-form novalidate>
    <div><label for="cName">Name</label><input id="cName" name="name" autocomplete="name" maxlength="60" required></div>
    <div><label for="cEmail">Email</label><input id="cEmail" name="email" type="email" autocomplete="email" maxlength="200" required><p class="c-hint">Never shown. We only use it to reply.</p></div>
    <div class="c-full"><label for="cText">Comment</label><textarea id="cText" name="comment" maxlength="2000" required></textarea></div>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="c-full"><button class="btn" type="submit" data-track="CommentSubmit">Post comment</button></div>
  </form>
  <p class="c-status" role="status" aria-live="polite"></p>
  <noscript><p class="c-intro">Comments need JavaScript. You can also email nmxprojects@gmail.com with the post link.</p></noscript>
</section>
